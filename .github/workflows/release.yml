name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Pull requests opened with the default GITHUB_TOKEN do not trigger CI. Set the
          # RELEASE_PLEASE_TOKEN secret if release pull requests must run the required checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    # npm publishing starts with the first functional release: the repository variable
    # NPM_PUBLISH is set to "true" once npm credentials are configured (see README.md).
    if: needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          # npm 11.5.1 or newer is needed for trusted publishing; Node.js 24 ships it.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check
        run: npm run typecheck && npx biome ci . && npm test

      - name: Build and check package
        run: npm run build && npm run check:package

      - name: Publish
        # Trusted publishing (OIDC) is used when it is configured on npmjs.com; otherwise the
        # NPM_TOKEN secret is used.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
